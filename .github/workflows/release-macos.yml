name: Release macOS

# 推 v* tag 时构建 macOS app、打成 dmg 并发布到 GitHub Releases。
# 手动触发只出 artifact，不发 Release（因为分支上没有 tag）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner 镜像（若 macos-26 上没有 Xcode 27，可换成 macos-27 等）"
        default: macos-26
        type: string

# 创建/更新 Release 需要 contents: write
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: todoMarkdown.xcodeproj
  SCHEME: todoMarkdown
  APP_NAME: todoMarkdown

jobs:
  build:
    # 工程 MACOSX_DEPLOYMENT_TARGET = 26.2，需要 Xcode 27 / macOS 26 SDK
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe 需要 tag 历史

      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version | cat
          xcrun --sdk macosx --show-sdk-version

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package app as dmg
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release/$APP_NAME.app"
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }

          # tag 推送用 tag 名，手动触发时用 git describe 兜底
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$(git describe --tags --always)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DMG=$APP_NAME-$VERSION-macos.dmg" >> "$GITHUB_ENV"

          # dmg 里放 app + 指向 /Applications 的快捷方式，用户可以拖拽安装
          STAGING="$RUNNER_TEMP/dmg"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$APP_NAME-$VERSION-macos.dmg"

          hdiutil verify "$APP_NAME-$VERSION-macos.dmg"
          shasum -a 256 "$APP_NAME-$VERSION-macos.dmg" | tee "$APP_NAME-$VERSION-macos.dmg.sha256"
          ls -lh "$APP_NAME-$VERSION-macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}-macos
          path: |
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256
          if-no-files-found: error
          retention-days: 30

      # 只有 tag 推送才建 Release；workflow_dispatch 时 github.ref_type 是 branch
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          files: |
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256
          generate_release_notes: true
          draft: false
          prerelease: false